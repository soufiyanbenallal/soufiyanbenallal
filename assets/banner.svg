<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soufiyan Benallal — Senior Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="55%" stop-color="#150c09"/>
      <stop offset="100%" stop-color="#1c0f0a"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="82%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FF3D2E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF3D2E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGrad2" cx="8%" cy="95%" r="45%">
      <stop offset="0%" stop-color="#FF8A50" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF8A50" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA35C"/>
      <stop offset="50%" stop-color="#FF5B33"/>
      <stop offset="100%" stop-color="#E2352A"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FF8A50" fill-opacity="0.4"/>
    </pattern>

    <radialGradient id="fadeMask" cx="28%" cy="58%" r="60%">
      <stop offset="0%" stop-color="black"/>
      <stop offset="65%" stop-color="black"/>
      <stop offset="100%" stop-color="white"/>
    </radialGradient>
    <mask id="dotMask">
      <rect width="1200" height="280" fill="url(#fadeMask)"/>
    </mask>

    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <circle cx="980" cy="55" r="240" fill="url(#glowGrad)" filter="url(#softBlur)"/>
  <circle cx="90" cy="270" r="200" fill="url(#glowGrad2)" filter="url(#softBlur)"/>
  <rect width="1200" height="280" fill="url(#dots)" mask="url(#dotMask)"/>

  <!-- frame border -->
  <rect x="1" y="1" width="1198" height="278" rx="14" fill="none" stroke="#FF5B33" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- corner accents -->
  <path d="M40 42 L40 74 M40 42 L72 42" stroke="url(#nameGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M1160 238 L1160 206 M1160 238 L1128 238" stroke="url(#nameGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- decorative code glyph -->
  <text x="960" y="205" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="130" font-weight="700" fill="url(#nameGrad)" opacity="0.10">{ }</text>

  <!-- name -->
  <text x="64" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1" fill="url(#nameGrad)">SOUFIYAN BENALLAL</text>

  <!-- underline accent -->
  <rect x="66" y="146" width="100" height="5" rx="2.5" fill="url(#nameGrad)"/>

  <!-- subtitle -->
  <text x="64" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#E4E4E9" opacity="0.92">Senior Full Stack Developer &#183; Tech Lead</text>

  <!-- tagline -->
  <text x="64" y="220" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14.5" font-weight="600" letter-spacing="3.2" fill="#FF8A50">REACT &#183; LARAVEL &#183; NODE.JS &#183; SHOPIFY APPS &amp; THEMES</text>
</svg>
